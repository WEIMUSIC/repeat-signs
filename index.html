<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>學樂大富翁（平板連線版）</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf3e4;--ink:#2b2a33;--muted:#6f6a7c;--line:#e6dbc6;--accent:#e4572e;--good:#2e9e5b;--bad:#d64545;--card:#fff;--board:#3d3556}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--ink);background-image:radial-gradient(#efe2c8 1px,transparent 1px);background-size:22px 22px}
button{font-family:inherit}
#app{display:flex;gap:12px;padding:10px;height:100vh;align-items:stretch;justify-content:center;overflow:hidden}
#board{display:grid;grid-template-columns:1.25fr repeat(7,1fr) 1.25fr;grid-template-rows:1.2fr repeat(3,1fr) 1.2fr;flex:1 1 0;width:0;min-width:0;height:100%;max-width:calc((100vh - 20px)*1.75);gap:3px;background:var(--board);padding:4px;border-radius:16px;box-shadow:0 10px 30px rgba(40,30,60,.25);font-size:clamp(10px,1.9vmin,20px)}
.cell{background:#fffdf7;border-radius:7px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:3px 2px;line-height:1.15;outline-offset:-3px;transition:background .2s}
.cell.corner{background:#fff4dc}
.cell.repStart,.cell.repEnd,.cell.segno,.cell.toCoda,.cell.ds,.cell.coda,.cell.dc,.cell.fine{background:#eef3ff}
.cell.corner.dc,.cell.corner.fine,.cell.corner.segno{background:#e3ecff}
.cell.chance{background:#fff0e6}.cell.fate{background:#f4ecff}
.band{position:absolute;top:0;left:0;right:0;height:17%}
.cell .nm{font-weight:900;font-size:1em;margin-top:.25em}
.cell .pr{font-size:.85em;color:var(--muted)}
.cell .sub{font-size:.78em;color:var(--muted)}
.cell .own{font-size:.9em;color:#fff;border-radius:8px;padding:.05em .45em;margin-top:.2em;font-weight:900;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.25);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.cell.owned .pr{display:none}
.cell .ownav{position:absolute;top:2px;right:2px;width:2.1em;height:2.1em;object-fit:contain;background:#fff;border:3px solid;border-radius:50%;z-index:1}
.cell .ownlv{font-weight:900;font-size:1.15em;line-height:1;text-shadow:0 1px 0 #fff}
.cell .it{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700;font-size:1.6em}
.cell .big{font-size:1.8em;color:var(--accent)}
.cell .qm{width:1.8em;height:1.8em;border-radius:50%;background:#f2994a;color:#fff;font-weight:900;font-size:1.2em;display:flex;align-items:center;justify-content:center}
.cell .qm.fate{background:#8e5cd9}
.ico{height:2.3em;width:auto}
.icoi{height:1em;vertical-align:-.15em}
.inl{height:1.15em;width:auto;vertical-align:-.25em}
.toks{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;position:absolute;bottom:2px;left:2px;right:2px}
.tok{width:1.55em;height:1.55em;border-radius:50%;border:2px solid #fff;color:#fff;font-size:.8em;font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.tok.now{animation:pulse 1s infinite}
.tok.img{width:2.7em;height:2.7em;background:#fff;border:3px solid;padding:1px;position:relative;font-size:1em}
.tok.img img{width:100%;height:100%;object-fit:contain;display:block}
.tok.img b{position:absolute;right:-.35em;bottom:-.35em;width:1.25em;height:1.25em;border-radius:50%;color:#fff;font-size:.6em;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
.beast{width:1.5em;height:1.5em;object-fit:contain;vertical-align:middle}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
#center{grid-row:2/5;grid-column:2/9;background:linear-gradient(160deg,#fffaf0,#fdeccc);border-radius:10px;display:grid;grid-template-columns:1.15fr 1fr;gap:1em;padding:2% 2.5%;overflow:hidden;min-height:0}
.cleft{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.55em;min-height:0}
.cright{display:flex;flex-direction:column;min-height:0}
.cright .log{flex:1;min-height:0}
#center .title{font-size:2.4em;font-weight:900;letter-spacing:.05em;color:#3d3556;text-align:center;line-height:1.1}
#center .title small{display:block;font-size:.38em;color:var(--muted);font-weight:700;letter-spacing:.1em}
.turn{font-size:1.4em}
.turn b{padding:.05em .5em;border-radius:8px;color:#fff}
.dicebox{display:flex;align-items:center;gap:1em}
.die{width:4.6em;height:4.6em;background:#fff;border-radius:16%;box-shadow:0 4px 0 #d8c9a8,0 6px 14px rgba(0,0,0,.15);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12%}
.die span{display:block;margin:12%;border-radius:50%}
.die span.p{background:#3d3556}
.die.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
.log{width:100%;flex:1;overflow:auto;background:rgba(255,255,255,.7);border-radius:10px;padding:.4em .7em;font-size:.95em;border:1px solid var(--line)}
.log div{padding:.15em 0;border-bottom:1px dashed #eadfca}
.log i{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin-right:.35em}
.chip{display:inline-block;padding:.1em .6em;border-radius:99px;background:#3d3556;color:#fff;font-weight:700;font-size:.85em}
.btn{border:none;border-radius:12px;padding:.55em 1em;font-size:1em;font-weight:700;background:#efe5d2;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #d6c6a6}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d6c6a6}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 #b33d1c}
.btn.good{background:var(--good);color:#fff;box-shadow:0 3px 0 #1f7442}
.btn.big{font-size:1.35em;padding:.55em 1.1em}
.btn.ghost{background:transparent;box-shadow:none;color:var(--muted);text-decoration:underline}
.btn:disabled{opacity:.45;cursor:not-allowed}
#side{width:clamp(270px,21vw,380px);flex:none;display:flex;flex-direction:column;gap:10px;height:100%;overflow-y:auto;padding-right:2px}
.panel{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 10px rgba(40,30,60,.08);display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:1.05em}
.panel label{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:700}
.panel select{font:inherit;padding:.3em .4em;border-radius:8px;border:2px solid var(--line);max-width:200px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.team{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;border:3px solid transparent;background:#fffaf0}
.team.now{border-color:var(--accent);background:#fff1e9}
.team .dot{width:46px;height:46px;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.team .info{flex:1;min-width:0}
.team .tn{font-weight:900;font-size:1.05em}
.team .tm{font-size:1.25em;font-weight:900;color:#b8860b}
.team .tp{font-size:.8em;color:var(--muted)}
.team .adj{display:flex;flex-direction:column;gap:3px}
.team .adj button{border:none;border-radius:6px;font-size:.75em;padding:2px 6px;cursor:pointer;background:#efe5d2;font-weight:700}
.badge{font-size:.7em;background:#8e5cd9;color:#fff;border-radius:6px;padding:0 .4em;margin-left:.3em}
.rules{font-size:.88em;color:var(--muted);line-height:1.6;background:#fff;border-radius:14px;padding:10px 14px}
.rules b{color:var(--ink)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(30,25,45,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px;animation:fade .15s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.md{background:#fff;border-radius:20px;max-width:920px;width:100%;max-height:95vh;overflow:auto;padding:20px 26px 22px;font-size:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1)}}
.md h2{margin:0 0 10px;font-size:1.4em}
.md .btns{display:flex;gap:12px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.md .btns .btn{font-size:1.05em;min-width:120px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.qhead .qt{font-weight:900;font-size:1.15em;margin-left:4px}
.intro{color:var(--muted);font-size:.9em;margin-bottom:6px}
.prompt{font-weight:900;font-size:1.15em;margin:6px 0 8px}
.svgwrap{background:#fffdf6;border:2px solid var(--line);border-radius:14px;padding:6px 10px;text-align:center;margin-bottom:12px}
svg.score{width:100%;height:auto}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{border:3px solid #e6dcc8;border-radius:14px;padding:10px 14px;font-size:1.05em;background:#fffaf0;cursor:pointer;text-align:left;display:flex;gap:12px;align-items:center;font-weight:700;color:var(--ink);line-height:1.4}
.opt:hover:not(:disabled){border-color:#f2a541;background:#fff4dd}
.opt .lt{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:#3d3556;color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85em}
.opt svg.score{max-width:230px}
.opt.ok{border-color:var(--good);background:#e6f6ec}
.opt.ok .lt{background:var(--good)}
.opt.no{border-color:var(--bad);background:#fde9e9}
.opt.no .lt{background:var(--bad)}
.opt:disabled{cursor:default}
.res{font-size:1.4em;font-weight:900;margin-top:14px}
.res.g{color:var(--good)}.res.b{color:var(--bad)}
.exp{background:#f6f2ea;border-radius:12px;padding:10px 14px;margin-top:8px;line-height:1.7}
.exp ul{margin:4px 0 0;padding-left:1.2em}
.fb .btn{margin-top:12px;float:right}
.tbar{height:10px;background:#eee;border-radius:9px;overflow:hidden;margin:4px 0 10px}
.tbar i{display:block;height:100%;background:linear-gradient(90deg,#2e9e5b,#f2a541,#d64545);width:100%;transition:width 1s linear}
.tnum{font-size:.85em;color:var(--muted);text-align:right}
/* setup */
.setup h1{margin:0 0 4px;font-size:1.8em}
.setup .lead{color:var(--muted);margin:0 0 14px;font-size:.9em}
.setup .sec{margin:14px 0 6px;font-weight:900}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:3px solid var(--line);background:#fffaf0;border-radius:12px;padding:.4em .9em;font-size:1em;font-weight:700;cursor:pointer}
.seg button.on{border-color:var(--accent);background:#fff0e8}
.lvcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvc{border:3px solid var(--line);background:#fffaf0;border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;font-size:.85em;line-height:1.5}
.lvc b{font-size:1.25em;display:block}
.lvc.on{border-color:var(--accent);background:#fff0e8}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.names input{font:inherit;font-size:.95em;padding:.35em .5em;border-radius:10px;border:3px solid;width:100%;font-weight:700}
.ordgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:10px}
.ordc{border:4px solid;border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;background:#fffaf0}
.ordc.need{box-shadow:0 0 0 4px #f2a54155}
.ordc .on{font-weight:900;font-size:1.2em}
.ordc .die{width:78px;height:78px;padding:10px}
.ordc .die span{width:14px;height:14px;margin:auto}
.ordc .hist{font-size:.85em;color:var(--muted)}
.ordc .rk{position:absolute;top:-12px;right:-8px;color:#fff;font-weight:900;border-radius:10px;padding:2px 10px;font-size:.85em}
.ordres{margin-top:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center}
.ordres .chip{font-size:1em;padding:4px 12px}
.avbtn{width:52px;height:52px;flex:none;border-radius:50%;border:3px solid;background:#fff;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.avbtn img{width:100%;height:100%;object-fit:contain}
.avbtn span{width:100%;height:100%;border-radius:50%;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center}
.avbtn::after{content:'✎';position:absolute;right:-4px;bottom:-4px;background:#3d3556;color:#fff;border-radius:50%;width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center}
.avbtn.on{box-shadow:0 0 0 4px #f2a54188}
.avpick{margin-top:10px;background:#fff7e8;border:2px dashed #f2a541;border-radius:14px;padding:10px 12px}
.avopts{display:flex;gap:10px;flex-wrap:wrap}
.avopt{border:3px solid var(--line);background:#fff;border-radius:14px;padding:6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:.85em;position:relative;min-width:84px}
.avopt img{width:60px;height:60px;object-fit:contain}
.avopt .num{width:52px;height:52px;margin:4px;border-radius:50%;color:#fff;font-size:1.4em;display:flex;align-items:center;justify-content:center}
.avopt.taken{opacity:.4;cursor:not-allowed;filter:grayscale(.7)}
.avopt.on{border-color:var(--accent);background:#fff0e8}
.avopt small{position:absolute;top:-10px;right:-6px;color:#fff;border-radius:8px;padding:0 6px;font-size:.75em}
.clockbox{display:flex;gap:6px;align-items:center;justify-content:center;min-height:1.6em}
.clock{font-size:1.35em;font-weight:900;background:#3d3556;color:#fff;border-radius:12px;padding:.1em .6em;font-variant-numeric:tabular-nums}
.clock.warn{background:#d64545;animation:pulse 1s infinite}
.clock.done{background:#2e9e5b;animation:none;font-size:1.05em}
.mini{border:none;border-radius:8px;background:#efe5d2;font-weight:700;font-size:.85em;padding:.25em .5em;cursor:pointer;font-family:inherit}
.winbox{text-align:center;margin:4px 0 14px}
.wint{font-size:1.8em;font-weight:900;color:#b8860b}
.wins{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.win1{border:5px solid;border-radius:20px;padding:8px 18px;background:#fffaf0;font-weight:900;font-size:1.4em;animation:popin .6s both}
.win1 img{width:110px;height:110px;object-fit:contain;display:block;margin:0 auto}
.winsub{color:var(--muted);font-weight:700}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:60}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.coin{height:1.15em;width:1.15em;vertical-align:-.22em;margin-right:.12em;object-fit:contain}
.team{position:relative}
.team .tm .coin{height:1.25em;width:1.25em}
.mfloat{position:absolute;right:64px;top:6px;font-weight:900;font-size:1.25em;animation:mup 1.8s forwards;pointer-events:none;text-shadow:0 1px 0 #fff;white-space:nowrap}
@keyframes mup{0%{opacity:0;transform:translateY(10px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px)}}
.turnban{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);z-index:45;background:#fff;border:12px solid;border-radius:40px;padding:3vmin 5vmin 3vmin 3vmin;display:flex;align-items:center;gap:4vmin;box-shadow:0 30px 90px rgba(40,30,60,.45);cursor:pointer;animation:tban 10s forwards;font-weight:900;font-size:min(9vmin,96px);white-space:nowrap;max-width:96vw}
.turnban img{width:min(30vmin,320px);height:min(30vmin,320px);object-fit:contain;animation:tbob 1.2s ease-in-out infinite}
.turnban small{display:block;font-size:.45em;color:var(--muted)}
.turnban .tbn{width:min(26vmin,280px);height:min(26vmin,280px);border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4em}
@keyframes tban{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}3%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}5%{transform:translate(-50%,-50%) scale(1)}95%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-55%) scale(.95)}}
@keyframes tbob{50%{transform:translateY(-6%) rotate(-3deg)}}
.turnban .tclose{display:block;font-size:.22em;color:var(--muted);font-weight:700;margin-top:1.2vmin}
.allbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#eaf4ff;border:2px solid #9cc7f2;border-radius:12px;padding:8px 12px;margin:4px 0 8px;font-size:.9em;flex-wrap:wrap}
.allbar .btn{font-size:.95em;padding:.35em .8em}
.ansl{font-size:.7em;color:var(--ink);margin-left:14px;background:#fff3d6;border-radius:10px;padding:2px 10px}
.allbox{margin-top:12px;background:#eaf4ff;border:2px dashed #9cc7f2;border-radius:14px;padding:10px 12px}
.allq{font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.allteams{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.allt{border:3px solid var(--c);background:#fff;border-radius:14px;padding:6px 12px;display:flex;align-items:center;gap:8px;font:inherit;font-weight:900;color:var(--c);cursor:pointer;position:relative}
.allt img{width:40px;height:40px;object-fit:contain}
.allt i{display:none;position:absolute;top:-10px;right:-10px;background:var(--good);color:#fff;border-radius:50%;width:26px;height:26px;font-style:normal;font-size:15px;align-items:center;justify-content:center}
.allt.sel{background:var(--c);color:#fff}
.allt.sel i{display:flex}
.cdown{position:fixed;inset:0;z-index:95;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(30,25,45,.35)}
.cdown span{font-size:180px;font-weight:900;color:#fff;text-shadow:0 8px 30px rgba(0,0,0,.4);animation:popin .35s both}
.cdown span.go{color:#ffd23f;font-size:140px}
.roles{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.roles>span{background:#fff;border:2px solid var(--line);border-radius:10px;padding:.1em .5em;font-size:.85em;white-space:nowrap}
.rollbtn{position:relative;display:flex;align-items:center;gap:.6em;border:none;border-radius:24px;padding:.45em 1.2em .45em .5em;background:linear-gradient(#ff8a5c,#e4572e);color:#fff;font:inherit;font-weight:900;font-size:1.45em;line-height:1.25;cursor:pointer;white-space:nowrap;text-align:left;animation:rglow 1.6s ease-in-out infinite,rwig 2.6s ease-in-out infinite}
.rollbtn .die{width:2.6em;height:2.6em;padding:.35em;flex:none;box-shadow:0 3px 0 #d8c9a8}
.rollbtn .die span{width:.42em;height:.42em;margin:auto}
.rollbtn .gem{color:#fff}
.rollbtn .seat{background:#fff;color:var(--accent)}
.rollbtn .tap{position:absolute;right:-.4em;top:-.9em;font-size:.55em;background:#ffd23f;color:#3d3556;border-radius:12px;padding:.15em .5em;box-shadow:0 2px 6px rgba(0,0,0,.2);animation:tapb 1s ease-in-out infinite}
.rollbtn:hover{filter:brightness(1.08)}
.rollbtn:active{transform:translateY(3px)!important}
.rollbtn:disabled{animation:none;opacity:.6;cursor:not-allowed;box-shadow:0 5px 0 #b33d1c}
.rollbtn:disabled .tap{display:none}
@keyframes rglow{0%,100%{box-shadow:0 5px 0 #b33d1c,0 0 8px 2px rgba(255,210,80,.45)}50%{box-shadow:0 5px 0 #b33d1c,0 0 30px 14px rgba(255,210,80,.95)}}
@keyframes rwig{0%,78%,100%{transform:rotate(0) scale(1)}82%{transform:rotate(-4deg) scale(1.05)}86%{transform:rotate(4deg) scale(1.05)}90%{transform:rotate(-3deg) scale(1.03)}94%{transform:rotate(2deg)}}
@keyframes tapb{50%{transform:translateY(-4px) scale(1.08)}}
.banroles{font-size:.42em;margin-top:2vmin}
.banroles .roles>span{font-size:1em;padding:.15em .6em;border-width:3px}
.rolebar{background:#fff1e9;border:2px solid #f2b79f;border-radius:12px;padding:8px 12px;margin:4px 0 6px;font-size:.92em}
.gem{display:inline-flex;align-items:center;gap:.2em;font-weight:900;color:var(--g);white-space:nowrap}
.gemi{height:1.05em;width:auto;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.btn .gem{color:#fff}
.seat{display:inline-block;background:#3d3556;color:#fff;border-radius:8px;padding:0 .4em;margin-left:.25em;font-weight:900;font-size:.9em}
.btn .seat{background:#fff;color:var(--accent)}

.wtip{color:var(--muted);font-size:.9em}
.wcls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin:14px 0}
.wclsc{background:#fff;border-radius:18px;border:4px solid #8e5cd9;padding:10px;display:flex;flex-direction:column;gap:6px}
.wgo{font:inherit;border:0;background:#f1e9ff;border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.wgo b{font-size:1.8em;color:#6636a3}.wgo small{color:var(--muted);font-family:monospace}
.wclsb{display:flex;gap:6px;justify-content:center}
.wadd{background:#fff;border-radius:18px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.wadd input{font:inherit;padding:.3em .5em;border:2px solid var(--line);border-radius:10px}
.wtab{width:100%;border-collapse:collapse}.wtab th{font-size:.75em;color:var(--muted);text-align:left}
.wtab td{padding:3px 4px;border-top:1px solid #f0ebe0}.wtab td.n{text-align:right;font-weight:900}
.wtab img{width:34px;height:34px;object-fit:contain;vertical-align:middle}
.wtab tr.now td{background:#fff6d9}.wturn{background:var(--accent);color:#fff;border-radius:8px;padding:0 6px;font-size:.75em}
.won{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;margin-left:-8px;vertical-align:bottom}.won.on{background:#2e9e5b}
.opt.hostpick{outline:5px solid #8e5cd9;outline-offset:2px}
@media (max-width:760px){.dlgrid,.dnames{grid-template-columns:1fr}.wgrid{grid-template-columns:1fr}}
.hurry{animation:hurry .5s;display:inline-block}
.tbar.hurry i{background:#d64545!important}
@keyframes hurry{0%{transform:scale(1)}40%{transform:scale(1.35);color:#d64545}100%{transform:scale(1)}}

.rboard{display:grid;grid-template-columns:1.2fr repeat(7,1fr) 1.2fr;grid-template-rows:1.1fr repeat(3,1fr) 1.1fr;gap:3px;background:#3d3556;padding:4px;border-radius:14px;width:100%;height:calc(100vh - 70px);font-size:clamp(11px,2.1vmin,20px)}
.mcell{background:#fffdf7;border-radius:6px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;line-height:1.1;padding:2px}
.mcell.chance{background:#fff0e6}.mcell.fate{background:#f4ecff}.mcell:not(.prop):not(.chance):not(.fate){background:#eef3ff}
.mband{position:absolute;top:0;left:0;right:0;height:14%}
.mnm{font-weight:900;font-size:1em;margin-top:.3em}
.mown{color:#fff;border-radius:6px;padding:0 .3em;font-weight:900;font-size:.85em;white-space:nowrap;max-width:100%;overflow:hidden}
.mtoks{display:flex;flex-wrap:wrap;justify-content:center;gap:1px}
.mtok{width:2.2em;height:2.2em;object-fit:contain;background:#fff;border:3px solid;border-radius:50%}
.mtok.now{animation:pulse 1s infinite;width:2.6em;height:2.6em}
.mcenter{grid-row:2/5;grid-column:2/9;background:#fff8ec;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6em;padding:.6em;font-size:1.25em;overflow:auto}
.mcenter .rollbtn.rbig{font-size:1.1em}
.mcenter .rcard{max-width:95%;font-size:.9em}
.mbtop{display:flex;gap:10px;align-items:center}.mclock{font-weight:900;background:#3d3556;color:#fff;border-radius:10px;padding:0 .5em}.mdie{font-weight:900}
.mturn{display:flex;align-items:center;gap:8px;font-size:1.3em;color:var(--c)}.mturn img{width:2.4em;height:2.4em;object-fit:contain}
.mscore{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;font-size:.8em}
.mscore span{border:3px solid var(--c);border-radius:999px;padding:0 .6em;color:var(--c);font-weight:900;background:#fff}.mscore span.me{background:var(--c);color:#fff}
.mshint{font-size:.6em;color:var(--muted);margin-bottom:-.4em}
.wtab td.wa{color:#6636a3}
.mlog{font-size:.65em;color:var(--muted);text-align:center}
.btns.lockhost .btn{pointer-events:none;opacity:.35;filter:grayscale(.7)}
.locknote{margin-top:10px;font-weight:900;font-size:1.1em;text-align:center;color:#6636a3;background:#f1e9ff;border-radius:12px;padding:8px}
.rollbtn.waitother{filter:grayscale(.6);opacity:.7}.rollbtn.waitother .tap{display:none}
body.duel .clockbox .mini{display:none}
body.duel #revBtn,body.duel #qNext,body.duel #allSel{display:none!important}
body.duel .allt{pointer-events:none}
body.duel .revealbar::after{content:'⏳ 大家答完就會自動公布答案';font-weight:900;color:#6636a3}
body.duel .fbrow::after{content:'⏳ 馬上進到下一步…';font-weight:900;color:#6636a3}
</style>
</head>
<body>
<div id="app">
  <div id="board"></div>
  <aside id="side">
    <div class="panel"><h3>🎵 各隊狀況</h3><div id="teams" style="display:flex;flex-direction:column;gap:8px"></div></div>
    <div class="panel" id="duelPanel"></div>
    <div class="panel" id="tchPanel">
      <h3>⚙️ 老師設定（隨時可調）</h3>
      <label>題目主題 <select id="thSel"><option value="repeat">‖: 反覆記號</option><option value="mus">🎼 音樂家的生平</option></select></label>
      <label>難易度
        <select id="lvSel">
          <option value="1">初級：‖: :‖ 反覆</option>
          <option value="2">中級：＋第一、二反覆、D.C.、Fine</option>
          <option value="3">高級：＋D.S.、Segno、Coda</option>
        </select></label>
      <label>答題時間
        <select id="tmSel"><option value="0">不限時</option><option value="20">20 秒</option><option value="30">30 秒</option><option value="60">60 秒</option></select></label>
      <label>每組人數（輪流任務）<select id="memSel"><option value="0">不使用</option><option value="3">3 人</option><option value="4">4 人</option><option value="5">5 人</option><option value="6">6 人</option></select></label>
      <label>全班同時作答 <input type="checkbox" id="allChk" checked style="width:22px;height:22px"></label>
      <label>音效 <input type="checkbox" id="sndChk" checked style="width:22px;height:22px"></label>
      <div class="row"><button id="helpBtn" class="btn">📖 小百科</button><button id="endBtn" class="btn">🏆 目前排名</button></div>
      <button id="finishBtn" class="btn" style="background:#3d3556;color:#fff;box-shadow:0 3px 0 #221d33">🏁 結束遊戲、宣布冠軍</button>
      <button id="remoteBtn" class="btn primary">📱 平板連線</button>
      <div id="remoteBadge" class="rbadge">📱 平板：尚未連線</div>
      <button id="seatBtn" class="btn">📋 寶石座號登記</button>
      <button id="tutSideBtn" class="btn">🎬 遊戲說明動畫</button>
      <button id="newBtn" class="btn">💾 存檔、換班級</button>
    </div>
    <div class="rules">
      <b>玩法</b>：輪流擲骰子前進。<br>
      停在<b>空地</b> → 答對挑戰題就能買地。<br>
      停在<b>自己的地</b> → 答對可加蓋音符（最多 ♪♪♪），過路費變高。<br>
      停在<b>別隊的地</b> → 付過路費，答對只付一半！<br>
      <b>全班同時作答</b>：每題各組都舉 A～D 答案卡，其他組答對也能加分！<br>
      <b>藍色特殊格</b>會照反覆記號移動：:‖ 退回 ‖:、D.S. 回到記號、D.C. 回到起點、To Coda 跳到 Coda。<br>
      按<b>空白鍵</b>也能擲骰子；隊伍卡右側 ± 可讓老師加減分。
    </div>
  </aside>
</div>

<div id="remote" hidden>
  <div class="rhead"><b id="rwho">📱 學樂大富翁</b><span id="rcode" class="rconn"></span><span id="rconn" class="rconn">連線中…</span><button class="mini" id="rexit">換組別</button></div>
  <div id="rbody"><div class="rmsg">⏳ 連線中…</div></div>
</div>

/* ---------- music symbols drawing ---------- */
function segnoMark(cx,cy,s=1){
  return `<g transform="translate(${cx},${cy}) scale(${s})"><text x="0" y="9" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-style="italic" font-weight="700" font-size="27" fill="${INK}">S</text><line x1="-9" y1="10" x2="9" y2="-12" stroke="${INK}" stroke-width="2"/><circle cx="-8.5" cy="1" r="2.1" fill="${INK}"/><circle cx="8.5" cy="-3" r="2.1" fill="${INK}"/></g>`;
}
function codaMark(cx,cy,s=1){
  return `<g transform="translate(${cx},${cy}) scale(${s})" stroke="${INK}" fill="none" stroke-width="2.2"><ellipse cx="0" cy="0" rx="7" ry="9"/><line x1="-12" y1="0" x2="12" y2="0"/><line x1="0" y1="-13" x2="0" y2="13"/></g>`;
}
const inlSegno=(c='inl')=>`<svg class="${c}" viewBox="-13 -15 26 28">${segnoMark(0,0,1)}</svg>`;
const inlCoda=(c='inl')=>`<svg class="${c}" viewBox="-14 -15 28 30">${codaMark(0,0,1)}</svg>`;
function icoRep(st){
  let s='';for(let k=0;k<5;k++)s+=`<line x1="2" x2="46" y1="${8+k*6}" y2="${8+k*6}" stroke="${INK}" stroke-width="1"/>`;
  if(st)s+=`<line x1="14" x2="14" y1="8" y2="32" stroke="${INK}" stroke-width="4.5"/><line x1="20" x2="20" y1="8" y2="32" stroke="${INK}" stroke-width="1.5"/><circle cx="26" cy="17" r="2.3"/><circle cx="26" cy="23" r="2.3"/>`;
  else s+=`<circle cx="22" cy="17" r="2.3"/><circle cx="22" cy="23" r="2.3"/><line x1="28" x2="28" y1="8" y2="32" stroke="${INK}" stroke-width="1.5"/><line x1="34" x2="34" y1="8" y2="32" stroke="${INK}" stroke-width="4.5"/>`;
  return `<svg class="ico" viewBox="0 0 48 40" fill="${INK}">${s}</svg>`;
}
function scoreSvg(m,opt={}){
  const W=opt.mw||78,nums=opt.nums!==false,T=44,LS=8,top=T,bot=T+4*LS;
  const xs=[];let x=14;
  m.forEach((ms,i)=>{if(ms.coda&&i>0)x+=46;xs.push(x);x+=W;});
  const total=x+14,H=116;
  const ln=(x1,y1,x2,y2,w=1.4)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="${w}"/>`;
  const dot=(cx,cy)=>`<circle cx="${cx}" cy="${cy}" r="2.6" fill="${INK}"/>`;
  const hasFine=m.some(q=>q.fine),hasCoda=m.some(q=>q.coda);
  let s='';
  m.forEach((ms,i)=>{
    const a=xs[i],b=a+W;
    for(let k=0;k<5;k++)s+=ln(a,T+k*LS,b,T+k*LS,1);
    const sectionStart=i===0||ms.coda;
    if(ms.startRepeat)s+=ln(a+2.5,top,a+2.5,bot,5)+ln(a+8,top,a+8,bot,1.4)+dot(a+13,top+12)+dot(a+13,top+20);
    else if(sectionStart)s+=ln(a,top,a,bot,1.4);
    if(ms.endRepeat)s+=dot(b-13,top+12)+dot(b-13,top+20)+ln(b-8,top,b-8,bot,1.4)+ln(b-2.5,top,b-2.5,bot,5);
    else if(i===m.length-1)s+=opt.end===false?ln(b,top,b,bot,1.4):ln(b-8,top,b-8,bot,1.4)+ln(b-2.5,top,b-2.5,bot,5);
    else if((m[i+1]&&m[i+1].coda)||ms.fine)s+=ln(b-5,top,b-5,bot,1.4)+ln(b,top,b,bot,1.4);
    else s+=ln(b,top,b,bot,1.4);
    if(nums&&ms.n!=null)s+=`<rect x="${a+W/2-16}" y="${top+1}" width="32" height="30" rx="7" fill="#fff3d6" stroke="#e0b65a"/><text x="${a+W/2}" y="${top+24}" text-anchor="middle" font-size="23" font-weight="900" fill="${INK}" font-family="Noto Sans TC,sans-serif">${ms.n}</text>`;
    if(ms.volta){const first=!(m[i-1]&&m[i-1].volta===ms.volta),last=!(m[i+1]&&m[i+1].volta===ms.volta);const x1=first?a+4:a,x2=last?b-6:b;s+=`<path d="${first?`M${x1},${top-4} L${x1},${top-16}`:`M${x1},${top-16}`} L${x2},${top-16}${ms.volta===1&&last?` L${x2},${top-4}`:''}" fill="none" stroke="${INK}" stroke-width="1.5"/>${first?`<text x="${a+9}" y="${top-5}" font-size="12" font-weight="700" fill="${INK}">${ms.volta}.</text>`:''}`;}
    if(ms.segno)s+=segnoMark(a+13,top-15,0.8);
    if(ms.coda)s+=codaMark(a+13,top-16,0.85);
    if(ms.toCoda)s+=`<text x="${b-25}" y="${top-11}" text-anchor="end" font-size="13" font-style="italic" font-weight="700" fill="${INK}" font-family="Georgia,serif">To</text>`+codaMark(b-13,top-16,0.75);
    const below=[];
    if(ms.fine)below.push('Fine');
    if(ms.dc)below.push(hasFine?'D.C. al Fine':hasCoda?'D.C. al Coda':'D.C.');
    if(ms.ds)below.push(hasFine?'D.S. al Fine':hasCoda?'D.S. al Coda':'D.S.');
    if(below.length)s+=`<text x="${b-2}" y="${bot+22}" text-anchor="end" font-size="14.5" font-style="italic" font-weight="700" fill="${INK}" font-family="Georgia,serif">${below.join(' ')}</text>`;
  });
  const hasTop=m.some(q=>q.volta||q.segno||q.coda||q.toCoda),hasBot=m.some(q=>q.fine||q.dc||q.ds);
  const y0=hasTop?8:34,y1=hasBot?H-6:bot+10;
  return `<svg viewBox="0 ${y0} ${total} ${y1-y0}" class="score${opt.nums===false?' scmini':''}" style="max-width:${Math.round(total*1.7)}px">${s}</svg>`;
}

/* ---------- score generator & playing-order simulator ---------- */
const mk=n=>Array.from({length:n},(_,i)=>({n:i+1}));
const GEN={
  rep_all(){const n=rnd(3,5),m=mk(n);m[n-1].endRepeat=true;return m;},
  rep_mid(){const n=rnd(5,6),m=mk(n);const s=rnd(1,n-3),e=rnd(s+1,n-1);m[s].startRepeat=true;m[e].endRepeat=true;return m;},
  rep_two(){const n=rnd(5,6),m=mk(n);if(Math.random()<.5)m[0].startRepeat=true;m[1].endRepeat=true;m[2].startRepeat=true;m[n===6?rnd(3,4):3].endRepeat=true;return m;},
  volta(){const n=rnd(5,7),m=mk(n);const s=rnd(0,1),v=rnd(s+1,Math.min(s+2,n-2));if(s>0||Math.random()<.5)m[s].startRepeat=true;m[v].volta=1;m[v].endRepeat=true;m[v+1].volta=2;return m;},
  volta2m(){const s=rnd(0,1),v=s+rnd(1,2),n=v+3+rnd(0,1),m=mk(n);if(s>0||Math.random()<.5)m[s].startRepeat=true;m[v].volta=1;m[v+1].volta=1;m[v+1].endRepeat=true;m[v+2].volta=2;return m;},
  dc_fine(){const n=rnd(5,7),m=mk(n);m[rnd(2,n-3)].fine=true;m[n-1].dc=true;return m;},
  dc_fine_rep(){const n=rnd(6,7),m=mk(n);const f=rnd(2,3),s=rnd(0,f-1),e=rnd(s+1,f);if(s>0)m[s].startRepeat=true;m[e].endRepeat=true;m[f].fine=true;m[n-1].dc=true;return m;},
  ds_fine(){const n=rnd(6,7),m=mk(n);const sg=rnd(1,2),f=rnd(sg+1,n-3);m[sg].segno=true;m[f].fine=true;m[n-1].ds=true;return m;},
  ds_coda(){const main=rnd(5,6),m=mk(main+2);const sg=rnd(1,2),t=rnd(sg+1,main-2);m[sg].segno=true;m[t].toCoda=true;m[main-1].ds=true;m[main].coda=true;return m;},
  dc_coda(){const main=rnd(5,6),m=mk(main+2);const t=rnd(2,main-2);m[t].toCoda=true;m[main-1].dc=true;m[main].coda=true;return m;},
  volta_dc(){const s=rnd(0,1),v=s+rnd(1,2),n=v+2+rnd(2,3),m=mk(n);if(s>0)m[s].startRepeat=true;m[v].volta=1;m[v].endRepeat=true;m[v+1].volta=2;m[v+1].fine=true;m[n-1].dc=true;return m;}
};
const LEVEL_TPL={

  if(level>=3)kinds.push('era','fact');
  for(let tries=0;tries<20;tries++){
    const k=pick(kinds);
    if(k==='w2m'){const m=pick(pool),w=pick(m.works);
      return{title:'🎵 作品配對題',prompt:`${fmtWork(w)}是哪一位音樂家的作品？`,options:namesOpts(m,pool),explain:musInfo(m)};}
    if(k==='m2w'){const m=pick(pool),w=pick(m.works);
      let ow=shuffle(pool.filter(x=>x!==m).flatMap(x=>x.works));if(ow.length<3)ow=ow.concat(shuffle(MUS.filter(x=>x!==m&&!pool.includes(x)).flatMap(x=>x.works)));
      return{title:'🎵 作品配對題',prompt:`下面哪一首是<b>${m.name}</b>的作品？`,one:true,options:shuffle([{html:fmtWork(w),ok:true},...ow.slice(0,3).map(x=>({html:fmtWork(x),ok:false}))]),explain:musInfo(m)};}
    if(k==='fact'){const m=pick(pool),f=pick(m.facts);
      const excl=MUS.filter(x=>x!==m&&(f.includes(x.name)||(f.includes('五人組')&&x.title==='俄國五人組'))).map(x=>x.id);
      return{title:'📜 生平故事題',prompt:`哪一位音樂家「${f.replace(/「/g,'『').replace(/」/g,'』')}」？`,options:namesOpts(m,pool,excl),explain:musInfo(m)};}
    if(k==='title'){const c=pool.filter(m=>m.title);if(!c.length)continue;const m=pick(c);
      const excl=MUS.filter(x=>x.title===m.title&&x!==m).map(x=>x.id);
      return{title:'🏅 稱號題',prompt:m.title==='俄國五人組'?'下面哪一位是「俄國五人組」的成員？':m.title==='印象樂派'?'下面哪一位是「印象樂派」的代表音樂家？':`被稱為「${m.title}」的是哪一位音樂家？`,options:namesOpts(m,pool,excl),explain:musInfo(m)};}
    if(k==='country'){const c=pool.filter(m=>m.country);if(!c.length)continue;const m=pick(c);
      const all=['奧地利','德國','義大利','英國','俄國','法國','波蘭','美國'];

    if(k==='era'){const c=pool.filter(m=>m.era);if(!c.length)continue;const m=pick(c);
      return{title:'⏳ 音樂時期題',prompt:`<b>${m.name}</b>屬於哪一個音樂時期？`,options:shuffle(['b','c','r'].map(e=>({html:ERA_NAME[e],ok:e===m.era})).concat([{html:'中古世紀',ok:false}])),explain:musInfo(m)+`<br><small>巴洛克時期約 1600–1750、古典時期約 1750–1820、浪漫時期約 1820–1900。</small>`};}
  }
  const m=pick(pool),w=pick(m.works);
  return{title:'🎵 作品配對題',prompt:`${fmtWork(w)}是哪一位音樂家的作品？`,options:namesOpts(m,pool),explain:musInfo(m)};

async function moveSteps(t,steps){
  const dir=Math.sign(steps);
  for(let k=0;k<Math.abs(steps);k++){
    t.pos=(t.pos+dir+24)%24;
    if(dir>0&&t.pos===0){t.money+=200;sfx.coin();log(`${t.name} 經過起點，領 200`,t);toast(`${t.name} 經過起點 +200 ${CI}`);}
    else sfx.step();
    renderBoard();renderTeams();await sleep(230);
  }
}

let CPU_FLOW=false;
function scheduleCpu(){
  if(!S||S.over||IS_REMOTE)return;
  const t=cur();if(!t||!t.cpu)return;
  clearTimeout(scheduleCpu.tm);
  scheduleCpu.tm=setTimeout(()=>{if(!S||S.over||!cur().cpu)return;if(S.busy||document.querySelector('.ov')){scheduleCpu();return;}roll(true);},2200);
}
async function roll(fromCpu){
  if(IS_REMOTE||!S||S.busy||S.over||document.querySelector('.ov'))return;
  if(cur().cpu&&fromCpu!==true)return;
  document.querySelectorAll('.turnban').forEach(e=>e.remove());
  S.busy=true;renderCenter();
  const t=cur(),die=$('#die');CPU_FLOW=!!t.cpu;
  die.classList.add('roll');
  for(let k=0;k<10;k++){die.innerHTML=dieHtml(rnd(1,6));sfx.dice();await sleep(65);}
  const d=rnd(1,6);S.lastDie=d;die.innerHTML=dieHtml(d);die.classList.remove('roll');
  log(`${t.name} 擲出 ${d} 點`,t);
  await sleep(250);
  try{await moveSteps(t,d);await land(t);}catch(e){console.error(e);}
  CPU_FLOW=false;
  t.turns=(t.turns||0)+1;

}
function announceTurn(){
  if(!S||S.over)return;

function nextTurn(){
  let g=0;
  do{
    const prev=S.cur;
    S.cur=(S.cur+1)%S.teams.length;
    if(S.cur<=prev){S.round=(S.round||1)+1;if(S.end&&S.end.mode==='rounds'&&S.round<=S.end.rounds)log(`進入第 ${S.round} 輪`);}
    const t=cur();
    if(t.skip>0){t.skip--;log(`${t.name} 休息一回合`,t);continue;}
    break;
  }while(g++<20);
}

const SCORE_NAME={money:'音符幣',assets:'總資產'};
const fmt=sec=>`${Math.floor(Math.max(0,sec)/60)}:${String(Math.max(0,sec)%60).padStart(2,'0')}`;
function renderClock(){
  const box=$('#clockBox');if(!box||!S)return;const e=S.end;
  if(!e||e.mode==='manual'){box.innerHTML=S.over?'<span class="clock done">🏁 遊戲結束</span>':'';return;}

  if(e.mode==='rounds'){box.innerHTML=`<span class="clock">🔁 第 ${Math.min(S.round||1,e.rounds)} / ${e.rounds} 輪</span>`;return;}
  const warn=e.left<=60;
  box.innerHTML=`<span class="clock${warn?' warn':''}${e.left<=0?' done':''}">${e.left<=0?'⏰ 時間到！這一組走完就結算':`⏱ ${fmt(e.left)}`}</span>${e.left>0?`<button class="mini" id="ckP">${e.paused?'▶ 繼續':'⏸ 暫停'}</button><button class="mini" id="ckA">+5 分</button>`:''}`;
  const pb=$('#ckP');if(pb)pb.onclick=()=>{e.paused=!e.paused;renderClock();save();};
  const ab=$('#ckA');if(ab)ab.onclick=()=>{e.left+=300;toast('加時 5 分鐘！');renderClock();save();};
}
setInterval(()=>{
  if(!S||S.over||!S.end||S.end.mode!=='time'||S.end.paused||S.end.left<=0)return;

},1000);
function checkEnd(){
  if(!S||S.over||!S.end||S.busy)return;

/* ---------- decide order by dice ---------- */
function decideOrder(teams){
  return new Promise(res=>{
    const st=teams.map(t=>({t,rolls:[],need:true,rolling:false}));
    let done=false,msg='每組派一位同學上來按「擲骰子」，<b>點數最大的組先開始</b>！平手的組要再擲一次。';
    const ov=document.createElement('div');ov.className='ov';
    document.body.appendChild(ov);
    const cmp=(a,b)=>{for(let i=0;i<Math.max(a.rolls.length,b.rolls.length);i++){const x=a.rolls[i]||0,y=b.rolls[i]||0;if(x!==y)return y-x;}return 0;};
    function draw(){
      const sorted=done?st.slice().sort(cmp):null;
      ov.innerHTML=`<div class="md" style="max-width:960px">
        <h2>🎲 擲骰子決定順序</h2>
        <div class="intro" style="font-size:1em;color:var(--ink)">${msg}</div>
        <div class="ordgrid">${st.map((o,k)=>{const last=o.rolls[o.rolls.length-1];const rank=done?sorted.indexOf(o)+1:0;
          return `<div class="ordc${o.need&&!done?' need':''}" style="border-color:${o.t.color}">
            ${rank?`<div class="rk" style="background:${o.t.color}">第 ${rank} 個</div>`:''}
            ${avImg(o.t,o.t.no-1)?`<img src="${avImg(o.t,o.t.no-1)}" style="width:64px;height:64px;object-fit:contain">`:''}<div class="on" style="color:${o.t.color}">${o.t.name}</div>
            <div class="die${o.rolling?' roll':''}" id="od${k}" style="${last||o.rolling?'':'opacity:.25'}">${dieHtml(last||1)}</div>
            <div class="hist">${o.rolls.length?o.rolls.join(' → '):'&nbsp;'}</div>
            <button class="btn primary" data-k="${k}" ${!o.need||o.rolling||done?'disabled':''}>${o.rolls.length&&o.need?'再擲一次':'擲骰子'}</button>
          </div>`;}).join('')}</div>
        ${done?`<div class="ordres">${sorted.map((o,i)=>`<span class="chip" style="background:${o.t.color}">${i+1}. ${o.t.name}</span>`).join('<b> → </b>')}</div>`:''}
        <div class="btns">
          <button class="btn" id="oskip">略過，照組別順序</button>
          ${done?'<button class="btn" id="oagain">全部重擲</button><button class="btn good big" id="ostart">照這個順序開始 ▶</button>':'<button class="btn primary" id="oall">剩下的組一起擲</button>'}
        </div></div>`;
      ov.querySelectorAll('.ordc button').forEach(b=>b.onclick=()=>roll(+b.dataset.k));
      ov.querySelector('#oskip').onclick=()=>{ov.remove();res(teams);};
      const a=ov.querySelector('#oall');if(a)a.onclick=()=>st.forEach((o,k)=>{if(o.need&&!o.rolling)roll(k);});
      const g=ov.querySelector('#oagain');if(g)g.onclick=()=>{st.forEach(o=>{o.rolls=[];o.need=true;});done=false;msg='重新擲骰子！點數最大的組先開始。';draw();};
      const s=ov.querySelector('#ostart');if(s)s.onclick=()=>{ov.remove();res(st.slice().sort(cmp).map(o=>o.t));};
    }
    function roll(k){
      const o=st[k];if(!o.need||o.rolling||done)return;
      o.rolling=true;draw();
      let n=0;const iv=setInterval(()=>{const d=ov.querySelector('#od'+k);if(d)d.innerHTML=dieHtml(rnd(1,6));sfx.dice();if(++n>=9){clearInterval(iv);o.rolling=false;o.rolls.push(rnd(1,6));o.need=false;sfx.coin();check();}},80);
    }
    function check(){
      if(st.some(o=>o.need||o.rolling)){draw();return;}
      const groups={};st.forEach(o=>{const key=o.rolls.join(',');(groups[key]=groups[key]||[]).push(o);});
      const ties=Object.values(groups).filter(g=>g.length>1);
      if(ties.length){
        ties.forEach(g=>g.forEach(o=>o.need=true));
        msg=ties.map(g=>`<b>${g.map(o=>o.t.name).join('、')}</b>`).join('；')+' 平手！平手的組再擲一次，比出誰先。';
        sfx.no();
      }else{done=true;msg='順序決定好了！🎉';sfx.ok();}
      draw();
    }
    draw();
  });
}

async function fbAdapter(cfg){
  if(cfg.mock)return mockDBA();

  await loadScript(`https://www.gstatic.com/firebasejs/${FB_VER}/firebase-database-compat.js`);
  const app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
  const db=firebase.database(app);
  return{
    set:(p,v)=>db.ref(p).set(v),
    push:(p,v)=>db.ref(p).push(v),
    remove:p=>db.ref(p).remove(),
    onValue(p,cb){const r=db.ref(p),f=s=>cb(s.val());r.on('value',f);return()=>r.off('value',f);},
    onChildAdded(p,cb){const r=db.ref(p),f=s=>cb(s.key,s.val());r.on('child_added',f);return()=>r.off('child_added',f);},
    onDisconnectRemove:p=>db.ref(p).onDisconnect().remove(),
    onConnected(cb){db.ref('.info/connected').on('value',s=>cb(!!s.val()));}
  };
}
function mockDBA(){
  const K='rm_mockdb',L=[];
  const get=()=>{try{return JSON.parse(localStorage.getItem(K)||'{}');}catch(e){return{};}};
  const notify=()=>L.slice().forEach(f=>f());
  window.addEventListener('storage',e=>{if(e.key===K)notify();});
  const at=(o,p)=>p.split('/').reduce((a,k)=>a==null?a:a[k],o);
  const setAt=(o,p,v)=>{const ks=p.split('/');let a=o;ks.slice(0,-1).forEach(k=>{if(typeof a[k]!=='object'||!a[k])a[k]={};a=a[k];});const last=ks[ks.length-1];if(v==null)delete a[last];else a[last]=JSON.parse(JSON.stringify(v));};
  const put=(p,v)=>{const o=get();setAt(o,p,v);localStorage.setItem(K,JSON.stringify(o));setTimeout(notify,0);return Promise.resolve();};
  return{
    set:put,push:(p,v)=>put(p+'/'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),v),remove:p=>put(p,null),
    onValue(p,cb){let last;const f=()=>{const v=JSON.stringify(at(get(),p)??null);if(v!==last){last=v;cb(JSON.parse(v));}};L.push(f);setTimeout(f,0);return()=>{};},
    onChildAdded(p,cb){const seen=new Set();const f=()=>{const o=at(get(),p)||{};Object.keys(o).sort().forEach(k=>{if(!seen.has(k)){seen.add(k);cb(k,o[k]);}});};L.push(f);setTimeout(f,0);return()=>{};},
    onDisconnectRemove(){},onConnected(cb){setTimeout(()=>cb(true),0);}
  };
}
// ---- 把資料庫包成「房間」：state（主畫面寫）、cmds（平板送指令）、presence（誰在線上） ----
function makeRoom(dba,code){
  const base='rooms/'+code,me=Math.random().toString(36).slice(2,10);
  let pres={},peers=[],conn=false,closed=false;const H={},PH=[],CH=[],OFF=[];
  const fire=(topic,data)=>(H[topic]||[]).forEach(f=>{try{f({topic,data,sameTab:false,isMe:false,peer:'x'});}catch(e){console.error(e);}});
  OFF.push(dba.onValue(base+'/state',v=>{if(v&&!closed)fire('state',v);}));
  OFF.push(dba.onChildAdded(base+'/cmds',(key,v)=>{
    if(IS_REMOTE||closed)return;
    dba.remove(base+'/cmds/'+key);
    if(!v||v.from===me||Date.now()-(v.ts||0)>60000)return;
    fire('cmd',v.d);
  }));
  OFF.push(dba.onValue(base+'/presence',v=>{if(closed)return;
    peers=Object.entries(v||{}).map(([id,p])=>({peer:id,sameTab:id===me,isMe:id===me,presence:p||{}}));
    PH.forEach(f=>f({peers,joined:peers.filter(p=>!p.sameTab),left:[],updated:[]}));
  }));
  dba.onConnected(c=>{if(closed)return;conn=c;if(c){dba.set(base+'/presence/'+me,Object.assign({t:Date.now()},pres));dba.onDisconnectRemove(base+'/presence/'+me);}CH.forEach(f=>f(c));});
  const clean=v=>JSON.parse(JSON.stringify(v));
  return{code,
    emit(topic,data){return topic==='state'?dba.set(base+'/state',clean(data)):dba.push(base+'/cmds',{from:me,ts:Date.now(),d:clean(data)});},
    on(t,f){(H[t]=H[t]||[]).push(f);return()=>{};},
    presence(p){Object.assign(pres,p);Object.keys(pres).forEach(k=>{if(pres[k]===null)delete pres[k];});return dba.set(base+'/presence/'+me,Object.assign({t:Date.now()},pres));},
    peers:()=>peers,onPeers(f){PH.push(f);return()=>{};},
    connected:()=>conn,onConnection(f){CH.push(f);setTimeout(()=>f(conn),0);return()=>{};},
    clearCmds:()=>dba.remove(base+'/cmds'),
    pub:(p,v)=>Promise.resolve(dba.set(p,clean(v))).catch(()=>{}),
    close(wipe){closed=true;OFF.forEach(f=>{try{f&&f();}catch(e){}});return wipe?dba.remove(base):dba.remove(base+'/presence/'+me);}
  };
}

function duelAutoReveal(ov){
  // 輪到的人答完後：等其他人也答完（最多 8 秒）就自動公布
  if(!isDuel()||ov.dataset.ar)return;ov.dataset.ar='1';
  const t0=Date.now();
  const iv=setInterval(()=>{
    if(!ov.isConnected||!CURQ||CURQ.ov!==ov||CURQ.done){clearInterval(iv);return;}
    const need=new Set([...duelJoined(),S.duel.host]);need.delete(S.cur);
    const all=[...need].every(k=>CURQ.answers[k]!=null);
    if(all||Date.now()-t0>8000){clearInterval(iv);const rv=ov.querySelector('#revBtn');if(rv)rv.click();}
  },400);
}

function duelStats(ci,idx){
  if(!S||!CURQ)return;
  const A=CURQ.answers;
  S.teams.forEach((t,k)=>{
    const a=k===S.cur?idx:A[k];
    if(k===S.cur||a!=null){t.qn=(t.qn||0)+1;if(a===ci)t.qc=(t.qc||0)+1;}
  });
}

    box.innerHTML=`<div class="whead"><b>👀 學生對戰・選擇班級</b><span style="flex:1"></span><button class="btn" id="wBack">◀ 回大富翁</button></div>
      <p class="wtip">每一班有自己的 QR Code 和觀看頁，各班的對戰結果會分開保存（存在雲端，換電腦也看得到，只要輸入同一個班級碼）。</p>
      <div class="wcls">${a.map((c,i)=>`<div class="wclsc"><button class="wgo" data-i="${i}"><b>${esc(c.n)}</b><small>班級碼 ${esc(c.w)}</small></button><span class="wclsb"><button class="mini" data-ren="${i}">✏️ 改名</button><button class="mini" data-del="${i}">🗑 刪除</button></span></div>`).join('')||'<div class="rmsg" style="grid-column:1/-1">還沒有班級，請在下面新增。</div>'}</div>
      <div class="wadd"><b>＋ 新增班級</b><input id="wN" maxlength="12" placeholder="班級名稱，例如 301"><input id="wC" maxlength="6" placeholder="班級碼（選填）" style="width:9em;text-transform:uppercase"><button class="btn good" id="wAdd">新增</button>
        <div class="wtip" style="width:100%">班級碼留空會自動產生。若要在另一台電腦看同一班，就在這裡填上原本的班級碼。</div></div>`;
    box.querySelector('#wBack').onclick=()=>{location.href=location.origin+location.pathname+(MOCK?'?mock=1':'');};
    box.querySelectorAll('.wgo').forEach(b=>b.onclick=()=>{const c=wClasses()[+b.dataset.i];location.href=pageURL({watch:c.w});});
    box.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const a=wClasses(),c=a[+b.dataset.del];const v=await modal({manual:true,title:`刪除「${esc(c.n)}」？`,html:'只會從這台電腦的清單移除，雲端上的對戰結果不會刪掉。',buttons:[{label:'取消',v:0},{label:'刪除',v:1,cls:'primary'}]});if(v){a.splice(+b.dataset.del,1);wSaveCls(a);draw();}});
    box.querySelectorAll('[data-ren]').forEach(b=>b.onclick=()=>{const a=wClasses(),c=a[+b.dataset.ren];const nn=prompt('新的班級名稱',c.n);if(nn&&nn.trim()){c.n=nn.trim().slice(0,12);wSaveCls(a);draw();}});
    box.querySelector('#wAdd').onclick=()=>{const n=box.querySelector('#wN').value.trim();let w=box.querySelector('#wC').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
      if(!n){toast('請輸入班級名稱');return;}if(w&&w.length!==6){toast('班級碼是 6 個字');return;}
      const a=wClasses();if(a.some(c=>c.n===n)){toast('已經有這個班級了');return;}a.push({n,w:w||newRoomCode()});wSaveCls(a);draw();};
  };
  draw();
}
async function showWatch(W){
  if(!W||W.length!==6){showWatchPicker();return;}
  {const a=wClasses();if(!a.some(c=>c.w===W)){a.push({n:'班級 '+W,w:W});wSaveCls(a);}}
  const CN=(wClasses().find(c=>c.w===W)||{}).n||'';
  try{localStorage.setItem(WATCH_KEY,W);}catch(e){}
  document.querySelectorAll('.ov').forEach(o=>o.remove());
  $('#app').style.display='none';
  FB_CFG=FB_CFG||await getCfg();
  const box=document.createElement('div');box.id='watch';document.body.appendChild(box);
  if(!FB_CFG){box.innerHTML='<div class="rmsg">⚠️ 還沒有設定 Firebase，沒辦法觀看。</div>';return;}
  const surl=pageURL({duel:W,cn:CN});
  box.innerHTML=`<div class="whead"><b>👀 ${esc(CN)}・學生對戰</b><span class="wcode">班級碼 <b>${W}</b></span><span style="flex:1"></span>
      <button class="btn" id="wQr">📱 收起 QR Code</button><button class="btn" id="wCsv">📥 下載成績</button><button class="btn" id="wClr">🧹 清除已結束的房間</button><button class="btn" id="wCls">🏫 換班級</button><button class="btn" id="wBack">◀ 回大富翁</button></div>
    <div class="wintro" id="wIntro"><div>${qrSvg(surl,210)}</div><div><h2>請學生用平板掃描 QR Code</h2>
      <ol><li>每組<b>一個人按「我來開遊戲桌」</b>，他的平板會當棋盤。</li><li>其他人按「加入同學的房間」，輸入棋盤上的<b>房間碼</b>。</li><li>開始後，每一組的狀況會出現在下面。</li></ol>
      <div class="curl"><input readonly value="${surl}"></div></div></div>
    <div class="wgrid" id="wGrid"><div class="rmsg">⏳ 等待學生開房間…</div></div>`;
  box.querySelector('#wBack').onclick=()=>{location.href=location.origin+location.pathname+(MOCK?'?mock=1':'');};
  box.querySelector('#wQr').onclick=()=>{const w=box.querySelector('#wIntro');w.classList.toggle('hide');box.querySelector('#wQr').innerHTML=w.classList.contains('hide')?'📱 顯示學生加入 QR Code':'📱 收起 QR Code';};
  box.querySelector('#wCls').onclick=()=>{location.href=pageURL({watch:''});};
  box.querySelector('#wCsv').onclick=()=>{const list=Object.entries(games||{}).filter(([,g])=>g&&g.players).sort((a,b)=>a[1].t-b[1].t);
    if(!list.length){toast('還沒有成績');return;}
    const rows=[['班級','桌','房間碼','時間','狀態','玩家','音符幣','土地','總資產','答對','作答']];
    list.forEach(([c,g],i)=>{const d=new Date(g.t);g.players.forEach(p=>rows.push([CN,g.tb||'',c,`${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`,g.over?'已結束':'進行中',p.n,p.m,p.p,p.a!=null?p.a:p.m,p.qc,p.qn]));});
    const csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\r\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`學生對戰成績_${CN||W}.csv`;a.click();};
  let dba,games={};
  try{dba=await fbAdapter(FB_CFG);}catch(e){box.querySelector('#wGrid').innerHTML='<div class="rmsg">⚠️ 連不上 Firebase</div>';return;}
  box.querySelector('#wClr').onclick=()=>{Object.entries(games).forEach(([c,g])=>{if(g&&(g.over||Date.now()-g.t>120000))dba.remove('rooms/'+W+'/games/'+c);});};
  const draw=()=>{
    const all=Object.entries(games||{}).filter(([,g])=>g&&g.players);
    const byStart=all.slice().sort((a,b)=>(a[1].t0||a[1].t)-(b[1].t0||b[1].t)).map(e=>e[0]);
    const num=c=>{const g=games[c];return g.tb||(100+byStart.indexOf(c));};
    const list=all.sort((a,b)=>(num(a[0])-num(b[0]))||((a[1].t0||a[1].t)-(b[1].t0||b[1].t)));
    const grid=box.querySelector('#wGrid');
    if(!list.length){grid.innerHTML='<div class="rmsg">⏳ 等待學生開房間…</div>';return;}
    grid.innerHTML=list.map(([c,g],i)=>{
      const stale=!g.over&&Date.now()-g.t>60000;
      const sc=p=>p.a!=null?p.a:p.m,top=Math.max(...g.players.map(sc));
      const st=g.over?'🏁 已結束':stale?'⚠️ 棋盤平板沒有回應':g.mode==='q'?`❓ 答題中${g.qt?'：'+esc(g.qt):''}`:'🎲 擲骰子中';
      return `<div class="wcard${g.over?' over':''}${stale?' stale':''}"><div class="wch"><b>${g.tb?`第 ${g.tb} 桌`:'未選桌號'}</b><span class="wrc">${esc(c)}</span><span class="wst">${st}</span><span class="wtime">${g.over?'':'⏱ '+fmt(g.left||0)}</span></div>
        <table class="wtab"><tr><th></th><th>玩家</th><th>${CI}</th><th>土地</th><th>總資產</th><th>答對</th></tr>
        ${g.players.map((p,k)=>`<tr class="${k===g.cur&&!g.over?'now':''}"><td><img src="${BEAST[p.av]||''}"><i class="won ${p.on?'on':''}"></i></td><td><b style="color:${p.c}">${esc(p.n)}</b>${k===g.cur&&!g.over?' <span class="wturn">輪到</span>':''}${g.over&&sc(p)===top?' 🏆':''}</td><td class="n">${p.m}</td><td class="n">${p.p}</td><td class="n wa">${sc(p)}</td><td class="n">${p.qc}/${p.qn}${p.qn?` <small>(${Math.round(p.qc/p.qn*100)}%)</small>`:''}</td></tr>`).join('')}</table></div>`;
    }).join('');
  };
  dba.onValue('rooms/'+W+'/games',v=>{games=v||{};draw();});
  setInterval(draw,5000);
}

/* ---------- 平板加入畫面（學生對戰用） ---------- */
function renderDuelJoin(st,box){
  const taken=new Set(ROOM?ROOM.peers().filter(p=>!p.sameTab&&p.presence&&p.presence.role==='group'&&Math.abs(Date.now()-(p.presence.t||0))<30000).map(p=>+p.presence.k):[]);
  box.innerHTML=`<div class="rjoin"><h2>你是哪一位？</h2>
    <div class="rjteams">${st.teams.filter(t=>t.k!==st.duel.host).map(t=>{const tk=taken.has(t.k);return `<button class="rjt" data-k="${t.k}" style="--c:${t.color}${tk?';opacity:.6':''}" data-tk="${tk?1:''}">${BEAST[t.av]?`<img src="${BEAST[t.av]}">`:''}<b>${esc(t.name)}</b><small>${tk?'已連線（斷線的話點這裡接回）':'點我加入'}</small></button>`;}).join('')}</div>
    <p class="rhint" style="margin-top:14px">🔄 斷線了嗎？選回你自己的名字，就能接著玩，分數都還在。</p></div>`;
  box.querySelectorAll('.rjt').forEach(b=>b.onclick=async()=>{const k=+b.dataset.k;
    if(b.dataset.tk){const v=await modal({manual:true,title:'這個名字顯示已連線',html:`如果你是 <b>${esc(st.teams[k].name)}</b>，而且剛剛斷線了，就按「是我，接回來」。<br><small>原本那台平板會被換掉。</small>`,buttons:[{label:'取消',v:0},{label:'是我，接回來',v:1,cls:'primary'}]});if(!v)return;}
    chooseRole(k);});
}

let WAKE=null;
async function keepAwake(){try{if(navigator.wakeLock&&document.visibilityState==='visible'&&!WAKE){WAKE=await navigator.wakeLock.request('screen');WAKE.addEventListener('release',()=>{WAKE=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState!=='visible')return;keepAwake();
  if(!ROOM)return;
  if(IS_REMOTE){ROOM.presence(GROUP_K===undefined?{role:'lobby',k:null}:GROUP_K!=null?{role:'group',k:GROUP_K}:{role:'remote',k:null}).catch(()=>{});ROOM.emit('cmd',{a:'hello'}).catch(()=>{});}
  else{ROOM.presence({role:'main'}).catch(()=>{});broadcast(true);publishWatch(null,true);}});
['click','touchstart'].forEach(ev=>document.addEventListener(ev,keepAwake,{passive:true}));
bindSide();
$('#rexit').onclick=exitRemote;
document.addEventListener('click',e=>{if(e.target&&e.target.id==='duelTBtn'){location.href=pageURL({watch:''});}});
if(qs.get('room')){startTablet();}else if(qs.has('watch')){showWatch((qs.get('watch')||'').toUpperCase());}else if(qs.has('duel')){getCfg().then(c=>{FB_CFG=c;});showDuelLobby();}else{showSetup();getCfg().then(c=>{FB_CFG=c;updateBadge();});}
</script>
